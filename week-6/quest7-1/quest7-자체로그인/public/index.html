<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오 쇼핑몰</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <!-- 토스페이먼츠 결제창 SDK (공식 주소, v2 경로) -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // 1. React 훅 가져오기
    // ========================================
    const { useState, useEffect, useRef } = React;

    // ========================================
    // 2. 설정값 (테스트용)
    // ========================================
    // 백엔드 주소: 같은 서버에서 열리므로 상대 경로를 씁니다.
    const API_BASE_URL = '/api';
    // 토스페이먼츠 "클라이언트 키" (테스트용 공식 예제 키). 프론트에 넣어도 되는 공개 키입니다.
    const TOSS_CLIENT_KEY = 'test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq';
    // 비회원 결제용 고객 식별값 (테스트에서는 이 값을 그대로 사용)
    const TOSS_CUSTOMER_KEY = 'ANONYMOUS';

    // 숫자를 "189,000원" 형태로 보여주는 도우미 함수
    const formatPrice = (value) => `${Number(value).toLocaleString('ko-KR')}원`;

    // ========================================
    // 2-1. 로그인 토큰 관리 (출입증 보관함)
    // 로그인하면 서버가 주는 토큰을 브라우저에 저장하고, 서버에 요청할 때마다 함께 보냅니다.
    // 브라우저 저장소가 막혀 있어도 화면이 깨지지 않도록 try/catch 로 감쌉니다.
    // ========================================
    const getToken = () => {
      try { return localStorage.getItem('shopToken'); } catch (e) { return null; }
    };
    const setToken = (token) => {
      try { localStorage.setItem('shopToken', token); } catch (e) { /* 저장 실패는 무시 */ }
    };
    const clearToken = () => {
      try { localStorage.removeItem('shopToken'); } catch (e) { /* 삭제 실패는 무시 */ }
    };
    // 요청 헤더에 붙일 "출입증" 만들기 (로그인 안 했으면 빈 객체)
    const authHeaders = () => {
      const token = getToken();
      return token ? { Authorization: `Bearer ${token}` } : {};
    };

    // ⭐ 모든 백엔드 요청이 지나가는 "공통 통로"
    // 토큰이 저장돼 있으면 Authorization: Bearer 토큰 을 자동으로 붙입니다.
    // 화면 코드에서는 헤더 걱정 없이 apiRequest('/orders', {...}) 만 부르면 됩니다.
    async function apiRequest(endpoint, { method = 'GET', body } = {}) {
      const headers = { ...authHeaders() };
      if (body !== undefined) headers['Content-Type'] = 'application/json';

      const res = await fetch(`${API_BASE_URL}${endpoint}`, {
        method,
        headers,
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({})); // JSON이 아니어도 죽지 않게

      // 토큰이 만료됐거나 위조됐으면(401) 저장된 토큰을 지우고 로그인 화면으로 보냅니다.
      if (res.status === 401 && getToken()) {
        clearToken();
        window.location.hash = '#/login';
      }
      if (!res.ok) throw new Error(data.message || '요청에 실패했어요.');
      return data;
    }

    // ========================================
    // 3. 공통 훅 (데이터 가져오기 / 해시 주소 읽기)
    // ========================================

    // 서버에서 데이터를 가져올 때 쓰는 훅: 로딩 / 에러 / 데이터를 한 번에 관리
    function useFetch(endpoint) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        let ignore = false; // 화면을 떠난 뒤에 도착한 응답은 무시 (정리 작업)
        setLoading(true);
        apiRequest(endpoint) // 토큰은 apiRequest 가 자동으로 실어 보냅니다
          .then((body) => {
            if (!ignore) setData(body);
          })
          .catch((err) => { if (!ignore) setError(err.message); })
          .finally(() => { if (!ignore) setLoading(false); });
        return () => { ignore = true; };
      }, [endpoint]);

      return { data, loading, error };
    }

    // 주소창의 #/... 부분을 읽어서 "지금 어느 화면인지" 알려주는 훅
    function getRoute() {
      const hash = window.location.hash.replace(/^#/, '') || '/';
      const [pathPart, queryPart] = hash.split('?');
      return { path: pathPart, query: new URLSearchParams(queryPart || '') };
    }

    function useRoute() {
      const [route, setRoute] = useState(getRoute);
      useEffect(() => {
        const onChange = () => setRoute(getRoute());
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      return route;
    }

    // ========================================
    // 4. 🎨 디자인 부품 (재사용 가능한 작은 조각들)
    //    비즈니스 로직 없이 props로만 모양을 바꿉니다.
    // ========================================

    // 버튼: variant(색 종류), size(크기)를 골라 쓸 수 있음
    function Button({ children, variant = 'primary', size = 'md', disabled = false, onClick, className = '', type = 'button' }) {
      const variants = {
        primary: 'bg-stone-800 text-white hover:bg-stone-600',
        secondary: 'bg-white text-stone-800 border border-stone-300 hover:bg-stone-50',
        danger: 'bg-red-600 text-white hover:bg-red-500',
        ghost: 'bg-transparent text-stone-600 hover:bg-stone-200',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-5 py-2.5 text-base',
        lg: 'px-6 py-4 text-lg font-semibold',
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    // 카드: 둥근 모서리와 그림자가 있는 흰색 상자
    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm p-4 sm:p-6 ${className}`}>
          {children}
        </div>
      );
    }

    // 상태 표시용 작은 알약 모양 라벨
    function Badge({ children, color = 'gray' }) {
      const colors = {
        gray: 'bg-stone-200 text-stone-700',
        blue: 'bg-blue-100 text-blue-700',
        amber: 'bg-amber-100 text-amber-700',
        green: 'bg-green-100 text-green-700',
      };
      return (
        <span className={`inline-block px-3 py-1 rounded-full text-xs font-semibold ${colors[color]}`}>
          {children}
        </span>
      );
    }

    // 주소 이동용 링크 (해시 주소를 바꿔서 화면을 전환)
    function Link({ to, children, className = '' }) {
      return <a href={`#${to}`} className={className}>{children}</a>;
    }

    // ========================================
    // 5. 🧩 공통 레이아웃 (모든 화면 위에 보이는 머리글)
    // ========================================
    function Header() {
      // 로그인 상태에 따라 오른쪽 버튼을 바꿉니다. (화면을 다시 그릴 때 저장소를 확인)
      const loggedIn = Boolean(getToken());
      const handleLogout = () => {
        clearToken();
        window.location.hash = '#/';
        window.location.reload();
      };
      return (
        <header className="bg-white border-b border-stone-200">
          <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <Link to="/" className="text-lg sm:text-xl font-bold">🛋️ 포트폴리오 쇼핑몰</Link>
            <nav className="flex gap-4 text-sm sm:text-base items-center">
              <Link to="/" className="hover:underline">홈</Link>
              <Link to="/mypage" className="hover:underline">마이페이지</Link>
              {loggedIn ? (
                <button onClick={handleLogout} className="text-stone-500 hover:underline">로그아웃</button>
              ) : (
                <Link to="/login" className="hover:underline">로그인</Link>
              )}
            </nav>
          </div>
        </header>
      );
    }

    // ========================================
    // 6. 📄 화면(페이지) 컴포넌트들
    // ========================================

    // ----- 6-1. 홈: 상품 목록 -----
    function HomePage() {
      const { data: products, loading, error } = useFetch('/products');

      if (loading) return <p className="text-center py-20 text-stone-500">상품을 불러오는 중이에요...</p>;
      if (error) return <p className="text-center py-20 text-red-600">{error}</p>;

      return (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          {products.map((p) => (
            <Link key={p.id} to={`/product/${p.id}`} className="block">
              <Card className="p-3 hover:shadow-md transition">
                <img src={p.image} alt={p.name} className="w-full aspect-square object-cover rounded-xl mb-3" />
                <p className="font-semibold text-sm sm:text-base">{p.name}</p>
                <p className="text-stone-500 text-sm">{formatPrice(p.price)}</p>
              </Card>
            </Link>
          ))}
        </div>
      );
    }

    // ----- 6-2. 상품 상세 + 결제 시작 -----
    function ProductDetailPage({ productId }) {
      const { data: product, loading, error } = useFetch(`/products/${productId}`);
      const [paying, setPaying] = useState(false);

      // [결제하기 버튼을 눌렀을 때의 흐름]
      // ① 백엔드에 상품ID·금액을 보내 검증받고 주문번호를 받는다
      // ② 검증된 정보로 토스 결제창을 연다
      const handlePay = async () => {
        // 로그인하지 않았으면 결제 전에 로그인 화면으로 보냅니다.
        if (!getToken()) {
          window.location.hash = '#/login';
          return;
        }
        setPaying(true);
        try {
          // ① 백엔드 검증 요청 (토큰은 apiRequest 가 자동으로 실어 보냄)
          const order = await apiRequest('/orders', {
            method: 'POST',
            body: { productId: product.id, amount: product.price },
          });

          // ② 토스 결제창 열기
          //    성공/실패 후 토스가 이 주소로 돌려보냅니다. (#/... 는 해시 라우팅 주소)
          const tossPayments = TossPayments(TOSS_CLIENT_KEY);
          const payment = tossPayments.payment({ customerKey: TOSS_CUSTOMER_KEY });
          await payment.requestPayment({
            method: 'CARD',
            amount: { currency: 'KRW', value: order.amount },
            orderId: order.orderId,
            orderName: order.orderName,
            successUrl: `${window.location.origin}/#/payment/success`,
            failUrl: `${window.location.origin}/#/payment/fail`,
          });
        } catch (err) {
          // 결제창을 사용자가 직접 닫은 경우는 조용히 넘어갑니다.
          if (err && err.code === 'USER_CANCEL') return;
          alert(`결제를 시작할 수 없어요.\n${err.message || ''}`);
        } finally {
          setPaying(false);
        }
      };

      if (loading) return <p className="text-center py-20 text-stone-500">상품 정보를 불러오는 중이에요...</p>;
      if (error) return <p className="text-center py-20 text-red-600">{error}</p>;

      return (
        <div>
          <Link to="/" className="text-sm text-stone-500 hover:underline">← 목록으로</Link>
          <Card className="mt-4 grid md:grid-cols-2 gap-6">
            {/* 왼쪽: 상품 이미지 */}
            <img src={product.image} alt={product.name} className="w-full aspect-square object-cover rounded-xl" />

            {/* 오른쪽: 상품 정보 + 결제 버튼 */}
            <div className="flex flex-col gap-4">
              <h1 className="text-2xl font-bold">{product.name}</h1>
              <p className="text-3xl font-bold">{formatPrice(product.price)}</p>
              <p className="text-stone-600 leading-relaxed">{product.description}</p>
              <div className="mt-auto">
                <Button size="lg" className="w-full" onClick={handlePay} disabled={paying}>
                  {paying ? '결제창 여는 중...' : '결제하기'}
                </Button>
              </div>
            </div>
          </Card>
        </div>
      );
    }

    // ----- 6-3. 결제 성공: 서버에 최종 승인 요청 후 마이페이지로 이동 -----
    function PaymentSuccessPage({ query }) {
      const [status, setStatus] = useState('loading'); // loading | done | error
      const [message, setMessage] = useState('');
      const requested = useRef(false); // 같은 승인 요청이 두 번 가지 않도록 막는 표시

      useEffect(() => {
        if (requested.current) return;
        requested.current = true;

        const body = {
          paymentKey: query.get('paymentKey'),
          orderId: query.get('orderId'),
          amount: Number(query.get('amount')),
        };

        // 주의: 주소창 금액(amount)은 조작될 수 있어서, 서버가 자기 주문 금액과 비교합니다.
        apiRequest('/payments/confirm', { method: 'POST', body })
          .then(() => {
            setStatus('done');
            // 승인 완료 → 2초 뒤 마이페이지로 이동
            setTimeout(() => { window.location.hash = '#/mypage'; }, 2000);
          })
          .catch((err) => {
            setStatus('error');
            setMessage(err.message);
          });
      }, []);

      return (
        <Card className="max-w-md mx-auto text-center py-12">
          {status === 'loading' && <p className="text-stone-500">결제를 확인하고 있어요...</p>}
          {status === 'done' && (
            <>
              <p className="text-5xl mb-4">✅</p>
              <h1 className="text-2xl font-bold mb-2">결제가 완료됐어요!</h1>
              <p className="text-stone-500 mb-6">잠시 후 마이페이지로 이동합니다.</p>
              <Link to="/mypage" className="underline">바로 이동하기</Link>
            </>
          )}
          {status === 'error' && (
            <>
              <p className="text-5xl mb-4">⚠️</p>
              <h1 className="text-xl font-bold mb-2">결제 확인에 실패했어요</h1>
              <p className="text-red-600 mb-6">{message}</p>
              <Link to="/" className="underline">홈으로 돌아가기</Link>
            </>
          )}
        </Card>
      );
    }

    // ----- 6-4. 결제 실패 / 취소 -----
    function PaymentFailPage({ query }) {
      return (
        <Card className="max-w-md mx-auto text-center py-12">
          <p className="text-5xl mb-4">❌</p>
          <h1 className="text-xl font-bold mb-2">결제가 취소되었거나 실패했어요</h1>
          <p className="text-stone-500 mb-6">{query.get('message') || '다시 시도해 주세요.'}</p>
          <Link to="/" className="underline">홈으로 돌아가기</Link>
        </Card>
      );
    }

    // ----- 6-5. 마이페이지: 주문 내역 -----
    // 주문 한 건을 보여주는 작은 컴포넌트
    function OrderItem({ order }) {
      // 주문 상태에 따라 라벨 색을 다르게 줍니다.
      const statusColor = { 결제대기: 'gray', 결제완료: 'blue', 배송준비중: 'amber' }[order.status] || 'green';
      return (
        <Card className="flex items-center gap-4 p-3 sm:p-4">
          <img src={order.image} alt={order.productName} className="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded-xl flex-shrink-0" />
          <div className="flex-1 min-w-0">
            <p className="font-semibold truncate">{order.productName}</p>
            <p className="text-sm text-stone-500 mt-1">{formatPrice(order.amount)}</p>
            <p className="text-xs text-stone-400 mt-1 truncate">주문번호 {order.orderId}</p>
          </div>
          <Badge color={statusColor}>{order.status}</Badge>
        </Card>
      );
    }

    // ----- 6-6. 로그인 / 회원가입 화면 -----
    // 한 화면에서 "로그인"과 "회원가입" 중 하나를 고르는 방식입니다.
    function LoginPage() {
      // 📌 useState 설명: 화면이 기억해야 할 값을 상자(state)에 담아 둡니다.
      //    값이 바뀌면 React가 화면을 자동으로 다시 그려 줍니다.
      const [mode, setMode] = useState('login');          // 'login' 또는 'signup'
      const [email, setEmail] = useState('');             // 입력한 이메일
      const [password, setPassword] = useState('');       // 입력한 비밀번호
      const [message, setMessage] = useState('');         // 에러 안내 문구
      const [submitting, setSubmitting] = useState(false); // 서버 응답 기다리는 중인지
      const isSignup = mode === 'signup';

      // 제출 버튼을 눌렀을 때 실행
      const handleSubmit = async (e) => {
        e.preventDefault(); // 페이지 새로고침(기본 동작) 막기
        setSubmitting(true);
        setMessage('');
        try {
          // 회원가입이면 /auth/signup, 로그인이면 /auth/login 으로 보냅니다.
          const endpoint = isSignup ? '/auth/signup' : '/auth/login';
          const data = await apiRequest(endpoint, { method: 'POST', body: { email, password } });

          // 🔑 JWT 토큰 저장: 서버가 준 출입증을 브라우저(LocalStorage)에 보관합니다.
          //    이후 apiRequest 가 이 토큰을 꺼내서 자동으로 보냅니다.
          setToken(data.token);
          window.location.hash = '#/mypage';
          window.location.reload(); // 헤더 버튼(로그인→로그아웃) 갱신
        } catch (err) {
          setMessage(err.message); // 실패하면 이유를 화면에 보여 줍니다.
          setSubmitting(false);
        }
      };

      return (
        <Card className="max-w-sm mx-auto">
          {/* 로그인 / 회원가입 전환 버튼 */}
          <div className="flex gap-2 mb-6">
            <Button variant={isSignup ? 'secondary' : 'primary'} className="flex-1" onClick={() => { setMode('login'); setMessage(''); }}>
              로그인
            </Button>
            <Button variant={isSignup ? 'primary' : 'secondary'} className="flex-1" onClick={() => { setMode('signup'); setMessage(''); }}>
              회원가입
            </Button>
          </div>

          <h1 className="text-xl font-bold mb-1">{isSignup ? '회원가입' : '로그인'}</h1>
          <p className="text-sm text-stone-500 mb-6">
            {isSignup ? '이메일과 비밀번호(6자 이상)만 입력하면 끝이에요.' : '테스트 계정: kim@example.com / pw1234'}
          </p>

          <form onSubmit={handleSubmit} className="flex flex-col gap-3">
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="이메일"
              autoComplete="email"
              required
              className="border border-stone-300 rounded-lg px-3 py-2"
            />
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="비밀번호"
              autoComplete={isSignup ? 'new-password' : 'current-password'}
              required
              minLength={isSignup ? 6 : undefined}
              className="border border-stone-300 rounded-lg px-3 py-2"
            />
            {message && <p className="text-red-600 text-sm">{message}</p>}
            <Button type="submit" size="lg" className="w-full" disabled={submitting}>
              {submitting ? '처리 중...' : isSignup ? '가입하고 시작하기' : '로그인'}
            </Button>
          </form>
        </Card>
      );
    }

    function MyPage() {
      // 로그인하지 않은 사람은 주문 목록을 요청할 필요가 없으니 바로 안내합니다.
      if (!getToken()) {
        return (
          <Card className="text-center py-12">
            <p className="text-stone-500 mb-4">마이페이지는 로그인 후 볼 수 있어요.</p>
            <Link to="/login" className="underline">로그인하러 가기</Link>
          </Card>
        );
      }
      return <MyOrders />;
    }

    function MyOrders() {
      const { data: orders, loading, error } = useFetch('/orders');

      return (
        <div className="max-w-3xl mx-auto">
          <h1 className="text-2xl font-bold mb-4">내 주문 내역</h1>

          {loading && <p className="text-stone-500 py-10 text-center">주문 내역을 불러오는 중이에요...</p>}
          {error && <p className="text-red-600 py-10 text-center">{error}</p>}

          {/* 주문이 하나도 없을 때 */}
          {!loading && !error && orders.length === 0 && (
            <Card className="text-center py-12">
              <p className="text-stone-500 mb-4">아직 주문한 상품이 없어요.</p>
              <Link to="/" className="underline">쇼핑하러 가기</Link>
            </Card>
          )}

          {/* 주문 목록 */}
          <div className="flex flex-col gap-3">
            {!loading && !error && orders.map((order) => <OrderItem key={order.orderId} order={order} />)}
          </div>
        </div>
      );
    }

    function NotFoundPage() {
      return (
        <Card className="text-center py-12">
          <p className="text-stone-500 mb-4">페이지를 찾을 수 없어요.</p>
          <Link to="/" className="underline">홈으로 돌아가기</Link>
        </Card>
      );
    }

    // ========================================
    // 7. 🚀 App: 주소에 따라 어떤 화면을 보여줄지 정함
    // ========================================
    function App() {
      const route = useRoute();
      const { path, query } = route;

      // 상품 상세 주소(#/product/숫자)에서 숫자만 꺼냄
      const productMatch = path.match(/^\/product\/(\d+)$/);

      let page;
      if (path === '/') page = <HomePage />;
      else if (productMatch) page = <ProductDetailPage key={path} productId={Number(productMatch[1])} />;
      else if (path === '/payment/success') page = <PaymentSuccessPage query={query} />;
      else if (path === '/payment/fail') page = <PaymentFailPage query={query} />;
      else if (path === '/mypage') page = <MyPage />;
      else if (path === '/login') page = <LoginPage />;
      else page = <NotFoundPage />;

      return (
        <>
          <Header />
          <main className="max-w-5xl mx-auto px-4 py-6">{page}</main>
        </>
      );
    }

    // ========================================
    // 8. 화면에 그리기
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
