<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>릴스 장면</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#f59e0b; --text:#f8fafc; --sub:#cbd5e1; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:360px; height:640px; overflow:hidden; background:var(--bg);
               color:var(--text); font-family:"Malgun Gothic", sans-serif; }
  .wrap { position:relative; width:360px; height:640px; padding:40px 24px 150px; display:flex;
          flex-direction:column; justify-content:center;
          background:radial-gradient(circle at 85% 8%, rgba(245,158,11,.22), transparent 45%), var(--bg); }
  .tag { font-size:14px; color:var(--accent); font-weight:700; letter-spacing:.5px; }
  h1 { font-size:30px; line-height:1.3; margin:12px 0; word-break:keep-all; }
  .big { font-size:54px; font-weight:900; color:var(--accent); margin:8px 0; word-break:keep-all; line-height:1.15; }
  p { font-size:19px; line-height:1.5; color:var(--sub); margin:6px 0; word-break:keep-all; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-top:14px; }
  .dots { position:absolute; top:18px; left:24px; display:flex; gap:6px; }
  .dots i { width:22px; height:4px; border-radius:2px; background:#334155; }
  .dots i.on { background:var(--accent); }
  .caption { position:absolute; left:14px; right:14px; bottom:44px; background:rgba(0,0,0,.65);
             color:#fff; border-radius:10px; padding:12px; text-align:center; font-size:18px;
             font-weight:700; min-height:56px; word-break:keep-all; line-height:1.4; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
  const S = window.SCENE;
  const wrap = document.getElementById('wrap');
  const esc = (t) => String(t || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let dots = '';
  for (let i = 0; i < window.TOTAL; i++) dots += `<i class="${i === window.INDEX ? 'on' : ''}"></i>`;
  const h1Size = S.h1.length > 22 ? 24 : S.h1.length > 16 ? 27 : 30;
  const bigSize = S.big && S.big.length > 12 ? 30 : S.big && S.big.length > 8 ? 40 : 54;
  wrap.innerHTML =
    `<div class="dots">${dots}</div>` +
    `<div class="tag">${esc(S.tag)}</div>` +
    `<h1 style="font-size:${h1Size}px">${esc(S.h1)}</h1>` +
    (S.big ? `<div class="big" style="font-size:${bigSize}px">${esc(S.big)}</div>` : '') +
    (S.p ? `<p>${esc(S.p)}</p>` : '') +
    (S.p2 ? `<div class="card"><p style="margin:0">${esc(S.p2)}</p></div>` : '') +
    `<div class="caption">${esc(S.caption)}</div>`;
</script>
</body>
</html>
