// ========================================
// 🎨 Design System Components
// ========================================

function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
  const base = 'inline-flex items-center justify-center gap-1.5 rounded-md font-bold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[#03C75A] disabled:opacity-40 disabled:cursor-not-allowed';
  const variants = {
    primary: 'bg-[#03C75A] text-white hover:brightness-95',
    secondary: 'bg-white text-[#333] border border-[#dadde0] hover:bg-[#f7f8f9]',
    ghost: 'bg-transparent text-[#666] hover:bg-[#f1f2f4]',
  };
  const sizes = {
    sm: 'px-2.5 py-1 text-xs',
    md: 'px-4 py-2 text-sm',
    lg: 'px-5 py-3 text-base',
  };
  return (
    <button
      type="button"
      onClick={onClick}
      disabled={disabled}
      className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
      {...rest}
    >
      {children}
    </button>
  );
}

/** 포털 특유의 흰 박스: 얇은 회색 테두리 + 제목줄 */
function Card({ title, action, id, className = '', bodyClass = '', children }) {
  return (
    <section id={id} className={`rounded-xl border border-[#e5e8eb] bg-white ${className}`}>
      {title && (
        <header className="flex items-center justify-between border-b border-[#f0f1f3] px-5 py-3.5">
          <h2 className="text-[17px] font-bold text-[#191919]">{title}</h2>
          {action}
        </header>
      )}
      <div className={`px-5 py-4 ${bodyClass}`}>{children}</div>
    </section>
  );
}

function Badge({ tone = 'gray', className = '', children }) {
  const tones = {
    gray:  'bg-[#f1f2f4] text-[#6b7280]',
    green: 'bg-[#e8f9ef] text-[#00a94d]',
    red:   'bg-[#fdecec] text-[#e0453a]',
  };
  return (
    <span className={`inline-flex items-center rounded px-1.5 py-0.5 text-[11px] font-bold ${tones[tone]} ${className}`}>
      {children}
    </span>
  );
}

function Chip({ active = false, onClick, className = '', children }) {
  return (
    <button
      type="button"
      onClick={onClick}
      aria-pressed={active}
      className={`rounded-full border px-3 py-1.5 text-[13px] font-bold transition-colors ${

          : 'border-[#dadde0] bg-white text-[#555] hover:bg-[#f7f8f9]'
      } ${className}`}
    >

    </button>
  );
}

// ========================================

function RecipeCard({ recipe }) {
  const ready = !!recipe.link;

  const thumb = recipe.thumb ? (
    <img src={recipe.thumb} alt="" aria-hidden="true" className="h-full w-full object-cover" />
  ) : (
    <span className="flex h-full w-full items-center justify-center bg-[#f1f2f4] text-[40px]" aria-hidden="true">
      {recipe.emoji}
    </span>
  );

  const inner = (
    <>
      <div className="relative h-[124px] w-full overflow-hidden rounded-lg">
        {thumb}
        {!ready && (
          <span className="absolute inset-0 flex items-center justify-center bg-white/70 text-[12px] font-bold text-[#888]">
            준비 중
          </span>
        )}
      </div>

      <div className="mt-2.5">
        <p className="flex items-center gap-1.5">
          <span className="text-[15px] font-bold text-[#191919]">{recipe.name}</span>
          {recipe.isNew && <Badge tone="red">N</Badge>}
        </p>
        <p className="mt-1 line-clamp-2 text-[13px] leading-snug text-[#777]">{recipe.desc}</p>
        <p className="mt-2 flex items-center gap-2 text-[12px] text-[#999]">
          <span>⏱ {recipe.minutes}분</span>
          <span className="text-[#e5e8eb]">|</span>
          <span>{recipe.ingredients.slice(0, 3).join(' · ')}</span>
        </p>
      </div>
    </>
  );

  if (!ready) {
    return (
      <li className="cursor-default rounded-lg p-2 opacity-70">{inner}</li>
    );
  }

  return (
    <li>
      <a
        href={recipe.link}
        className="block rounded-lg p-2 transition-colors hover:bg-[#f7f8f9]"
        title={recipe.linkLabel}
      >
        {inner}
      </a>
    </li>
  );
}

function RecipeGrid({ recipes, query, category, onReset }) {
  const catLabel = CATEGORIES.find((c) => c.key === category);
  const heading = query
    ? `'${query}' 검색 결과`
    : category === 'all'
      ? '레시피 모아보기'
      : catLabel.label + ' 레시피';

  return (
    <Card
      title={heading}
      action={<span className="text-[13px] text-[#999]">{recipes.length}개</span>}
    >
      {recipes.length === 0 ? (
        <div className="py-12 text-center">
          <p className="text-[32px]" aria-hidden="true">🔎</p>
          <p className="mt-2 text-[15px] font-bold text-[#555]">찾는 레시피가 없습니다.</p>
          <p className="mt-1 text-[13px] text-[#999]">다른 재료 이름으로 찾아보세요.</p>
          <Button variant="secondary" size="md" className="mt-4" onClick={onReset}>
            전체 레시피 보기
          </Button>
        </div>
      ) : (
        <ul className="grid grid-cols-2 gap-x-2 gap-y-4 sm:grid-cols-3">
          {recipes.map((r) => <RecipeCard key={r.name} recipe={r} />)}
        </ul>
      )}
    </Card>
  );
}

function RankingWidget({ onPick }) {

          <li key={r.name}>

      <div className="flex flex-wrap gap-1.5">
        {FRIDGE.map((ing) => (
          <Chip key={ing} active={active === ing} onClick={() => onPick(active === ing ? '' : ing)}>
            {ing}
          </Chip>
        ))}
      </div>
    </Card>
  );
}

function ShoppingMemo() {
  const [items, setItems] = useState(['김치', '참치캔']);
  const [draft, setDraft] = useState('');

  const add = useCallback(() => {
    const value = draft.trim();
    if (!value) return;
    setItems((prev) => (prev.indexOf(value) >= 0 ? prev : prev.concat([value])));
    setDraft('');
  }, [draft]);

  return (
    <Card title="장보기 메모" className="mt-4">
      <div className="flex gap-2">
        <input
          type="text"
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
          placeholder="살 것을 적으세요"
          aria-label="장보기 항목 입력"
          className="h-9 flex-1 rounded-md border border-[#dadde0] px-3 text-[14px] outline-none focus:border-[#03C75A]"
        />
        <Button size="md" onClick={add} disabled={!draft.trim()}>추가</Button>
      </div>

      {items.length === 0 ? (
        <p className="mt-3 text-center text-[13px] text-[#aaa]">적어둔 것이 없습니다.</p>
      ) : (
        <ul className="mt-3 space-y-1">
          {items.map((item) => (
            <li key={item} className="flex items-center gap-2 rounded px-1 py-1.5 hover:bg-[#f7f8f9]">
              <span className="text-[#03C75A]" aria-hidden="true">•</span>
              <span className="flex-1 text-[14px] text-[#333]">{item}</span>
              <button
                type="button"
                onClick={() => setItems((prev) => prev.filter((x) => x !== item))}
                aria-label={item + ' 지우기'}
                className="px-1 text-[13px] text-[#bbb] hover:text-[#e0453a]"
              >
                ✕
              </button>
            </li>
          ))}
        </ul>
      )}
    </Card>
  );
}

      </div>
      <ul className="mt-3 space-y-1.5 text-[13px] text-[#666]">
        <li>· 김치가 시면 설탕을 조금 더 넣는다.</li>
        <li>· 볶음밥·덮밥에는 찬밥이 더 낫다.</li>
        <li>· 매우면 김치를 물에 한 번 헹군다.</li>
      </ul>
    </Card>
  );
}


// ========================================
// 🚀 App
// ========================================

function App() {
  const [query, setQuery] = useState('');
  const [category, setCategory] = useState('all');

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return RECIPES.filter((r) => {
      const inCategory = category === 'all' || r.cats.indexOf(category) >= 0;
      if (!inCategory) return false;
      if (!q) return true;
      const haystack = (r.name + ' ' + r.desc + ' ' + r.ingredients.join(' ')).toLowerCase();
      return haystack.indexOf(q) >= 0;
    });
  }, [query, category]);

  const reset = useCallback(() => {
    setQuery('');
    setCategory('all');
  }, []);

  return (
    <div className="min-h-screen">
      <UtilityBar />
      <SearchHero query={query} onQueryChange={setQuery} />
      <QuickMenu category={category} onCategoryChange={setCategory} />

      <main className="border-t border-[#e5e8eb] bg-[#f5f6f8] pb-10 pt-5">
        <div className="mx-auto grid max-w-[1130px] gap-4 px-5 lg:grid-cols-[1fr_360px]">
          <div>
            <RecipeGrid recipes={filtered} query={query.trim()} category={category} onReset={reset} />
            <NoticeBoard />
          </div>

          <aside>
            <RankingWidget onPick={setQuery} />
            <FridgeWidget onPick={setQuery} active={query} />
            <ShoppingMemo />
            <TipsWidget />
          </aside>
        </div>
      </main>

      <Footer />
    </div>
  );
}


// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
