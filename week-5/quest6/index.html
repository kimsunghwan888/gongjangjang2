    const PAGE_MD = `# 시그니처 쏘팔메토 옥타 플러스

    const mdToHtml = (md) => md.split('\n').map((l) => {
      if (l.startsWith('# ')) return `<h1>${l.slice(2)}</h1>`;
      if (l.startsWith('## ')) return `<h2>${l.slice(3)}</h2>`;
      if (l.startsWith('> ')) return `<blockquote>${l.slice(2)}</blockquote>`;
      if (l.startsWith('- ')) return `<li>${l.slice(2)}</li>`;
      return l.trim() ? `<p>${l}</p>` : '';
    }).filter(Boolean).join('\n');

    // ========================================
    // 🎨 Design System Components
    // ========================================
    // ========================================
    // 🔌 Backend API (server.js)
    // ========================================
    if (location.protocol === 'file:') document.title = '서버로 접속하세요 (node server.js → http://localhost:3000)';
    const store = {
      get: () => JSON.parse(localStorage.getItem('hs_session') || 'null'),
      set: (s) => (s ? localStorage.setItem('hs_session', JSON.stringify(s)) : localStorage.removeItem('hs_session')),
    };
    async function api(path, { method = 'GET', body } = {}, retry = true) {
      const s = store.get();
      const res = await fetch(path, {
        method, body: body ? JSON.stringify(body) : undefined,
        headers: { 'Content-Type': 'application/json', ...(s ? { Authorization: `Bearer ${s.accessToken}` } : {}) },
      });
      if (res.status === 401 && s && retry && !path.startsWith('/api/auth/')) {
        const r = await fetch('/api/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken: s.refreshToken }) });
        if (r.ok) { store.set({ ...s, ...(await r.json()).data }); return api(path, { method, body }, false); }
        store.set(null);
        window.dispatchEvent(new Event('hs-logout'));
      }
      const j = await res.json().catch(() => ({ success: false, message: '서버 응답 오류' }));
      if (!j.success) throw new Error(j.message || '요청 실패');
      return j.data;
    }

    const toMarket = ({ coupang, importSurge }) => ({

    const SERVER_STATUS = { queued: 'collecting', collecting: 'collecting', designing: 'designing', done: 'done', failed: 'idle' };

    const Card = ({ children, className = '' }) => (

    const Input = ({ label, error, className = '', ...props }) => (

    // ========================================
    // 📄 Page Components
    // ========================================
    const AuthScreen = ({ onAuthed }) => {
      const [email, setEmail] = useState('');
      const [error, setError] = useState('');
      const [phase, setPhase] = useState('form'); // form | sending | sent | success
      const [devLink, setDevLink] = useState('');
      const timers = useRef([]);
      useEffect(() => () => timers.current.forEach(clearTimeout), []);

      const send = async (e) => {
        e.preventDefault();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setError('올바른 이메일 주소를 입력해 주세요.');
        setError('');
        setPhase('sending');
        try {
          const d = await fetch('/api/auth/request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) }).then((r) => r.json());
          if (!d.success) throw new Error(d.message);
          setDevLink(d.devLink || '');
          if (d.devLink) return verify(d.devLink);
          setPhase('sent');
        } catch (err) { setError(err.message || '발송에 실패했어요.'); setPhase('form'); }
      };
      const verify = async (link = devLink) => {
        try {
          const token = new URL(link).searchParams.get('token');
          const d = await fetch('/api/auth/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) }).then((r) => r.json());
          if (!d.success) throw new Error(d.message);
          store.set({ ...d.data, email: d.data.user.email });
          setPhase('success');
          timers.current.push(setTimeout(() => onAuthed(d.data.user.email), 1400));
        } catch (err) { setError(err.message); setPhase('form'); }
      };

      const run = async () => {
        const cmd = text.trim();
        if (!cmd || (status !== 'idle' && status !== 'done')) return;
        const now = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        try {
          const d = await api('/api/commands', { method: 'POST', body: { command: cmd } });
          setLog((l) => [{ cmd, at: now }, ...l].slice(0, 5));
          setText('');
          setStatus('collecting');
          onJob(d.jobId);
        } catch (err) { alert(err.message); }
      };

      const voice = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return alert('이 브라우저는 음성 입력을 지원하지 않아요. 텍스트로 입력해 주세요.');
        if (listening) return recRef.current && recRef.current.stop();
        const rec = new SR();
        rec.lang = 'ko-KR';
        rec.onresult = (e) => setText(e.results[0][0].transcript);
        rec.onend = () => setListening(false);
        rec.onerror = () => setListening(false);
        recRef.current = rec;
        setListening(true);
        rec.start();

          api('/api/market').catch(() => null), api('/api/match').catch(() => null), api('/api/outputs').catch(() => null),
        ]);
        setData({ market: m && toMarket(m), match: x && toMatchRows(x.rows), output: o && o[0] ? toOutput(o[0]) : null });
      };

      // 메일 링크(?token=)로 진입한 경우 자동 로그인
      useEffect(() => {
        const token = new URLSearchParams(location.search).get('token');
        if (!token) return;
        history.replaceState(null, '', location.pathname);
        fetch('/api/auth/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) })
          .then((r) => r.json()).then((d) => {
            if (!d.success) return alert(d.message);
            store.set({ ...d.data, email: d.data.user.email }); setEmail(d.data.user.email);
          });
      }, []);
      useEffect(() => { window.addEventListener('hs-logout', logout); return () => window.removeEventListener('hs-logout', logout); }, []);

      // 로그인 후: 기존 결과 불러오기 + 웹소켓으로 작업 상태 푸시 수신
      useEffect(() => {
        if (!email) return;
        let ws, retry, closed = false;
        loadData();
        const connect = async () => {
          await api('/api/jobs').catch(() => {}); // 만료된 액세스 토큰이면 여기서 갱신
          const s = store.get();
          if (closed || !s) return;
          ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?token=${s.accessToken}`);
          ws.onmessage = (ev) => {
            const m = JSON.parse(ev.data);
            if (m.type === 'job.status') setStatus(SERVER_STATUS[m.status] || 'idle');
            if (m.type === 'job.done') { setStatus('done'); loadData(); }
            if (m.type === 'job.failed') { setStatus('idle'); alert(m.message); }
          };
          ws.onclose = () => { if (!closed) retry = setTimeout(connect, 3000); };
        };
        connect();
        return () => { closed = true; clearTimeout(retry); ws && ws.close(); };
      }, [email]);

      return (
        <div className="mx-auto w-full max-w-[430px] min-h-screen bg-slate-50 shadow-xl relative">
          {!email ? <AuthScreen onAuthed={setEmail} /> : (
            <div className="flex flex-col min-h-screen">
              <Header email={email} status={status} onLogout={logout} />
              <main className="flex-1 p-4 pb-6 fade-up" key={tab}>
                {tab === 'control' && <ControlTab status={status} setStatus={setStatus} log={log} setLog={setLog} onJob={() => {}} />}
                {tab === 'market' && <MarketTab market={data.market} />}
                {tab === 'match' && <MatchTab match={data.match} />}
                {tab === 'output' && <OutputTab output={data.output} />}
              </main>
              <BottomNav tab={tab} onChange={setTab} />
            </div>
          )}
        </div>
      );
    };

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
