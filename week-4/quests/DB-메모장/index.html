<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 메모장</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #203038; --paper: #fffdf6; --line: #e6dfcf; --accent: #087e8b; --warm: #f5c451; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f1efe7; color: var(--ink); }
    .memo-font { font-family: 'Gowun Dodum', sans-serif; }
    .paper-lines { background-image: linear-gradient(#e8e1d2 1px, transparent 1px); background-size: 100% 2rem; background-position: 0 .65rem; }
    @keyframes lift { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .lift { animation: lift .28s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .lift { animation: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;
    const API = '/api/memos';

    function IconButton({ icon, label, onClick, disabled, tone = 'plain' }) {
      const styles = {
        plain: 'text-slate-500 hover:bg-slate-100 hover:text-slate-900',
        danger: 'text-red-600 hover:bg-red-50',
      };
      return <button type="button" onClick={onClick} disabled={disabled} title={label} aria-label={label}
        className={`grid h-11 w-11 place-items-center rounded-lg transition disabled:cursor-not-allowed disabled:opacity-40 ${styles[tone]}`}>
        <i data-lucide={icon} className="h-5 w-5"></i>
      </button>;
    }

    function MemoForm({ initial, onSave, onCancel, busy }) {
      const [title, setTitle] = useState(initial?.title || '');
      const [content, setContent] = useState(initial?.content || '');
      const titleRef = useRef(null);
      const editing = Boolean(initial);

      useEffect(() => { titleRef.current?.focus(); }, []);
      const submit = (event) => {
        event.preventDefault();
        onSave({ title, content });
      };

      return <form onSubmit={submit} className="border-b-2 border-[#e6dfcf] bg-[#fffdf6] p-5 sm:p-7">
        <div className="mb-5 flex items-center justify-between gap-4">
          <h2 className="text-xl font-black sm:text-2xl">{editing ? '메모 고치기' : '새 메모'}</h2>
          {editing && <IconButton icon="x" label="수정 취소" onClick={onCancel} disabled={busy} />}
        </div>
        <input ref={titleRef} value={title} onChange={e => setTitle(e.target.value)} maxLength="100"
          placeholder="제목을 적어 주세요" aria-label="메모 제목" disabled={busy}
          className="mb-3 w-full border-b-2 border-[#b9afa0] bg-transparent px-1 py-3 text-xl font-bold outline-none placeholder:text-stone-400 focus:border-[#087e8b] disabled:opacity-60" />
        <textarea value={content} onChange={e => setContent(e.target.value)} maxLength="5000" rows="7"
          placeholder="기억하고 싶은 내용을 적어 보세요." aria-label="메모 내용" disabled={busy}
          className="paper-lines memo-font min-h-44 w-full resize-y border-0 bg-transparent px-1 py-2 text-lg leading-8 outline-none placeholder:text-stone-400 disabled:opacity-60" />
        <div className="mt-5 flex items-center justify-between gap-4">
          <span className="text-sm text-stone-500">{content.length.toLocaleString()} / 5,000</span>
          <button type="submit" disabled={busy}
            className="inline-flex min-h-12 items-center gap-2 rounded-lg bg-[#087e8b] px-5 py-3 text-lg font-bold text-white shadow-sm transition hover:bg-[#05646e] disabled:cursor-not-allowed disabled:opacity-50">
            <i data-lucide="save" className="h-5 w-5"></i>{busy ? '저장 중' : editing ? '바꾸기' : '메모 저장'}
          </button>
        </div>
      </form>;
    }

    function MemoItem({ memo, onEdit, onDelete, busy }) {
      const formatted = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(memo.createdAt));
      return <article className="lift border-b border-[#e6dfcf] px-5 py-5 last:border-b-0 sm:px-7">
        <div className="flex items-start gap-3">
          <div className="min-w-0 flex-1">
            <h3 className="break-words text-xl font-black text-slate-800">{memo.title}</h3>
            <time className="mt-1 block text-sm text-stone-500">{formatted}</time>
          </div>
          <div className="flex shrink-0">
            <IconButton icon="pencil" label={`${memo.title} 고치기`} onClick={() => onEdit(memo)} disabled={busy} />
            <IconButton icon="trash-2" label={`${memo.title} 지우기`} tone="danger" onClick={() => onDelete(memo)} disabled={busy} />
          </div>
        </div>
        <p className="memo-font mt-4 whitespace-pre-wrap break-words text-lg leading-8 text-slate-700">{memo.content}</p>
      </article>;
    }

    function App() {
      const [memos, setMemos] = useState([]);
      const [search, setSearch] = useState('');
      const [loading, setLoading] = useState(true);
      const [busy, setBusy] = useState(false);
      const [editing, setEditing] = useState(null);
      const [message, setMessage] = useState('');

      useEffect(() => { lucide.createIcons(); });

      const request = async (url, options = {}) => {
        const response = await fetch(url, options);
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.success) throw new Error(payload.message || '요청을 처리하지 못했습니다.');
        return payload;
      };

      const load = async (word = search) => {
        setLoading(true);
        try {
          const payload = await request(`${API}?search=${encodeURIComponent(word)}`);
          setMemos(payload.data);
          setMessage('');
        } catch (error) {
          setMessage(error.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { load(''); }, []);

      const submitSearch = (event) => { event.preventDefault(); load(); };
      const save = async (form) => {
        setBusy(true);
        try {
          if (editing) {
            await request(`${API}/${editing.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(form) });
            setEditing(null);
          } else {
            await request(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(form) });
          }
          await load();
        } catch (error) {
          setMessage(error.message);
        } finally {
          setBusy(false);
        }
      };

      const remove = async (memo) => {
        if (!window.confirm(`'${memo.title}' 메모를 지울까요?`)) return;
        setBusy(true);
        try {
          await request(`${API}/${memo.id}`, { method: 'DELETE' });
          await load();
        } catch (error) {
          setMessage(error.message);
        } finally {
          setBusy(false);
        }
      };

      return <main className="min-h-screen px-4 py-7 sm:px-7 sm:py-12">
        <div className="mx-auto grid max-w-6xl overflow-hidden border border-[#d7d0c1] bg-[#fffdf6] shadow-xl shadow-stone-300/50 lg:grid-cols-[370px_1fr]">
          <aside className="bg-[#f5c451] p-6 sm:p-8 lg:min-h-[680px]">
            <div className="flex items-center gap-3">
              <span className="grid h-12 w-12 place-items-center rounded-lg bg-[#203038] text-[#f5c451]"><i data-lucide="notebook-pen" className="h-7 w-7"></i></span>
              <h1 className="text-3xl font-black tracking-normal">내 메모장</h1>
            </div>
            <p className="memo-font mt-8 max-w-xs text-lg leading-8 text-[#36454a]">적어 둔 생각은 데이터베이스에 차곡차곡 저장됩니다.</p>
            <div className="mt-10 border-l-2 border-[#203038]/30 pl-4 text-base leading-7 text-[#36454a]">
              메모를 고치거나, 필요한 단어로 찾아볼 수 있습니다.
            </div>
          </aside>
          <section className="min-w-0">
            <MemoForm key={editing ? editing.id : 'new'} initial={editing} onSave={save} onCancel={() => setEditing(null)} busy={busy} />
            <div className="border-b border-[#e6dfcf] bg-white px-5 py-4 sm:px-7">
              <form onSubmit={submitSearch} className="flex gap-2">
                <label className="flex min-w-0 flex-1 items-center gap-3 rounded-lg border border-stone-300 bg-[#fffdf6] px-3 focus-within:border-[#087e8b] focus-within:ring-2 focus-within:ring-[#087e8b]/20">
                  <i data-lucide="search" className="h-5 w-5 shrink-0 text-stone-500"></i>
                  <input value={search} onChange={e => setSearch(e.target.value)} placeholder="제목이나 내용에서 찾기" aria-label="메모 검색"
                    className="min-w-0 flex-1 bg-transparent py-3 text-base outline-none placeholder:text-stone-400" />
                </label>
                <button type="submit" className="rounded-lg bg-[#203038] px-4 font-bold text-white hover:bg-[#354b54]" title="검색" aria-label="검색"><i data-lucide="arrow-right" className="h-5 w-5"></i></button>
              </form>
            </div>
            {message && <div role="alert" className="mx-5 mt-5 border-l-4 border-red-500 bg-red-50 p-4 text-base font-bold text-red-700 sm:mx-7">{message}</div>}
            <div className="flex items-center justify-between px-5 pb-3 pt-6 sm:px-7">
              <h2 className="text-xl font-black">메모 목록</h2>
              <span className="text-base text-stone-500">{loading ? '불러오는 중' : `${memos.length}개`}</span>
            </div>
            {loading ? <div className="px-5 pb-10 text-lg text-stone-500 sm:px-7">메모를 불러오는 중입니다.</div>
              : memos.length ? <div>{memos.map(memo => <MemoItem key={memo.id} memo={memo} onEdit={setEditing} onDelete={remove} busy={busy} />)}</div>
              : <div className="px-5 pb-12 pt-5 text-center sm:px-7"><i data-lucide="sticky-note" className="mx-auto h-10 w-10 text-stone-400"></i><p className="mt-4 text-lg text-stone-500">{search ? '찾는 메모가 없습니다.' : '첫 메모를 남겨 보세요.'}</p></div>}
          </section>
        </div>
      </main>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
