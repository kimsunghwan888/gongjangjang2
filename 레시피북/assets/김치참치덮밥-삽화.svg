      <ellipse cx="599" cy="120" rx="7" ry="12"/>
      <ellipse cx="849" cy="74" rx="6" ry="11"/>
      <ellipse cx="1087" cy="116" rx="7" ry="12"/>
    </g>

    <g stroke="#7A2A18" stroke-width="2" opacity=".7">
      <line x1="98" y1="112" x2="142" y2="112"/>
      <line x1="331" y1="86" x2="373" y2="86"/>
      <line x1="584" y1="126" x2="628" y2="126"/>
      <line x1="836" y1="80" x2="876" y2="80"/>
      <line x1="1072" y1="122" x2="1116" y2="122"/>
    </g>
  </g>

  <!-- 김 -->
  <g fill="none" stroke="url(#steamFade)" stroke-width="8" stroke-linecap="round">
    <path d="M792,322 C770,282 812,262 790,220 C772,186 806,168 796,142"/>
    <path d="M824,326 C848,290 812,266 838,228 C858,196 828,176 842,150"/>
    <path d="M810,318 C806,286 822,268 810,238"/>
  </g>

  <!-- 포장마차 상판 -->
  <rect x="0" y="388" width="1200" height="92" fill="url(#counter)"/>
  <rect x="0" y="388" width="1200" height="4" fill="#8A5B3C" opacity=".55"/>

  <!-- 덮밥 한 그릇 -->
  <g>
    <ellipse cx="812" cy="392" rx="78" ry="12" fill="#0A0606" opacity=".55"/>
    <path d="M748,338 C748,376 772,392 812,392 C852,392 876,376 876,338 Z" fill="#2A1C1A"/>
    <path d="M748,338 C748,376 772,392 812,392 C852,392 876,376 876,338 Z" fill="none" stroke="#C98A4E" stroke-width="2.5" opacity=".5"/>
    <ellipse cx="812" cy="338" rx="64" ry="14" fill="#3A2825"/>
    <ellipse cx="812" cy="334" rx="57" ry="13" fill="#EFE3CB"/>
    <g fill="#C4402A">
      <ellipse cx="782" cy="336" rx="13" ry="5" transform="rotate(-12 782 336)"/>
      <ellipse cx="838" cy="338" rx="12" ry="5" transform="rotate(9 838 338)"/>
      <ellipse cx="806" cy="342" rx="10" ry="4" transform="rotate(-4 806 342)"/>
    </g>
    <ellipse cx="814" cy="328" rx="27" ry="12" fill="#FBF5E9"/>
    <circle cx="814" cy="327" r="9.5" fill="#F0B33B"/>
    <circle cx="810" cy="324" r="3" fill="#FBD98A" opacity=".8"/>
    <g stroke="#A8C46A" stroke-width="2.5" stroke-linecap="round" opacity=".9">
      <line x1="800" y1="320" x2="816" y2="316"/>
      <line x1="820" y1="318" x2="834" y2="322"/>
    </g>
  </g>

  <!-- 젓가락 -->
  <g stroke="#C68A52" stroke-width="4" stroke-linecap="round" opacity=".85">
    <line x1="906" y1="386" x2="978" y2="366"/>
    <line x1="908" y1="394" x2="980" y2="376"/>
