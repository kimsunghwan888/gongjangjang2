  <!-- 나란히 앉은 두 사람 (뒷모습) -->
  <g>
    <path d="M268,480 C268,384 292,340 350,340 C408,340 432,384 432,480 Z" fill="#120C16"/>
    <circle cx="350" cy="300" r="38" fill="#120C16"/>
    <path d="M312,296 C312,268 330,254 350,254 C370,254 388,268 388,296 C378,282 322,282 312,296 Z" fill="#1B1220"/>
    <path d="M268,480 C268,384 292,340 350,340" fill="none" stroke="#FFB765" stroke-width="3" opacity=".28"/>
    <path d="M316,308 A38,38 0 0 1 336,266" fill="none" stroke="#FFB765" stroke-width="3" opacity=".3"/>

    <path d="M470,480 C470,396 490,356 540,356 C590,356 610,396 610,480 Z" fill="#0D0912"/>
    <circle cx="540" cy="322" r="33" fill="#0D0912"/>
    <path d="M507,320 C507,296 522,284 540,284 C558,284 573,296 573,320 C564,308 516,308 507,320 Z" fill="#160E1B"/>
    <path d="M610,480 C610,396 590,356 540,356" fill="none" stroke="#FFB765" stroke-width="3" opacity=".26"/>
    <path d="M566,330 A33,33 0 0 0 548,292" fill="none" stroke="#FFB765" stroke-width="3" opacity=".28"/>
  </g>

  <rect width="1200" height="480" fill="url(#vignette)"/>
</svg>
