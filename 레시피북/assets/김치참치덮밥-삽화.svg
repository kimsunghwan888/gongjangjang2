<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sceneTitle sceneDesc" preserveAspectRatio="xMidYMid slice">
  <title id="sceneTitle">밤 포장마차의 한 그릇</title>
  <desc id="sceneDesc">등불이 걸린 밤 포장마차에서 두 사람이 나란히 앉아, 김이 모락모락 오르는 덮밥 한 그릇을 앞에 두고 있는 삽화입니다.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1730"/>
      <stop offset="45%" stop-color="#2A1F3E"/>
      <stop offset="78%" stop-color="#5A3038"/>
      <stop offset="100%" stop-color="#7A4130"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFF3D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow">
      <stop offset="0%" stop-color="#FFB25A" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#FF8A3C" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FF8A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B93A20"/>
      <stop offset="45%" stop-color="#F0803A"/>
      <stop offset="100%" stop-color="#A8321C"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C3A2A"/>
      <stop offset="18%" stop-color="#33201A"/>
      <stop offset="100%" stop-color="#160E0D"/>
    </linearGradient>
    <linearGradient id="steamFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFF6E8" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#FFF6E8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".5"/>
    </radialGradient>
  </defs>

  <!-- 밤하늘 -->
  <rect width="1200" height="480" fill="url(#sky)"/>

  <!-- 별 -->
  <g fill="#FFF4DC">
    <circle cx="96" cy="54" r="1.8" opacity=".75"/>
    <circle cx="188" cy="122" r="1.3" opacity=".5"/>
    <circle cx="292" cy="42" r="1.6" opacity=".65"/>
    <circle cx="432" cy="96" r="1.2" opacity=".45"/>
    <circle cx="612" cy="38" r="1.7" opacity=".7"/>
    <circle cx="742" cy="112" r="1.2" opacity=".4"/>
    <circle cx="880" cy="58" r="1.5" opacity=".6"/>
    <circle cx="1128" cy="150" r="1.4" opacity=".5"/>
  </g>

  <!-- 달 -->
  <circle cx="1012" cy="96" r="120" fill="url(#moonGlow)"/>
  <circle cx="1012" cy="96" r="38" fill="#F8ECCF"/>
  <circle cx="1026" cy="86" r="6" fill="#E6D6B4" opacity=".55"/>
  <circle cx="1000" cy="110" r="4" fill="#E6D6B4" opacity=".45"/>

  <!-- 멀리 보이는 마을 -->
  <path fill="#160F22" d="M0,388 L0,306 L62,306 L62,272 L142,272 L142,314 L204,314 L204,250 L262,250 L262,228 L344,228 L344,292 L402,292 L402,262 L472,262 L472,300 L562,300 L562,238 L624,238 L624,206 L702,206 L702,268 L782,268 L782,302 L862,302 L862,254 L942,254 L942,290 L1022,290 L1022,264 L1102,264 L1102,306 L1200,306 L1200,388 Z"/>
  <g fill="#F4B053">
    <rect x="24" y="322" width="12" height="16" opacity=".85"/>
    <rect x="84" y="288" width="11" height="15" opacity=".7"/>
    <rect x="112" y="288" width="11" height="15" opacity=".5"/>
    <rect x="164" y="330" width="12" height="16" opacity=".8"/>
    <rect x="222" y="268" width="11" height="15" opacity=".75"/>
    <rect x="284" y="246" width="12" height="16" opacity=".9"/>
    <rect x="312" y="246" width="12" height="16" opacity=".55"/>
    <rect x="360" y="308" width="11" height="15" opacity=".7"/>
    <rect x="424" y="280" width="11" height="15" opacity=".6"/>
    <rect x="496" y="318" width="12" height="16" opacity=".8"/>
    <rect x="584" y="256" width="11" height="15" opacity=".85"/>
    <rect x="644" y="224" width="12" height="16" opacity=".9"/>
    <rect x="674" y="224" width="12" height="16" opacity=".6"/>
    <rect x="722" y="286" width="11" height="15" opacity=".7"/>
    <rect x="806" y="320" width="12" height="16" opacity=".75"/>
    <rect x="884" y="272" width="11" height="15" opacity=".8"/>
    <rect x="966" y="308" width="11" height="15" opacity=".6"/>
    <rect x="1044" y="282" width="12" height="16" opacity=".85"/>
    <rect x="1124" y="324" width="12" height="16" opacity=".7"/>
  </g>

  <!-- 등불 -->
