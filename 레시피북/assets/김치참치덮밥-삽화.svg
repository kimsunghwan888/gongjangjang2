    <circle cx="352" cy="86" r="96" fill="url(#lampGlow)"/>
    <circle cx="606" cy="126" r="104" fill="url(#lampGlow)"/>
    <circle cx="856" cy="80" r="92" fill="url(#lampGlow)"/>
    <circle cx="1094" cy="122" r="96" fill="url(#lampGlow)"/>

    <g stroke="#2A1A20" stroke-width="2.5">
      <line x1="120" y1="0" x2="120" y2="80"/>
      <line x1="352" y1="0" x2="352" y2="54"/>
      <line x1="606" y1="0" x2="606" y2="94"/>
      <line x1="856" y1="0" x2="856" y2="48"/>
      <line x1="1094" y1="0" x2="1094" y2="90"/>
    </g>

    <g>
      <ellipse cx="120" cy="112" rx="27" ry="34" fill="url(#lampBody)"/>
      <ellipse cx="352" cy="86" rx="25" ry="32" fill="url(#lampBody)"/>
      <ellipse cx="606" cy="126" rx="27" ry="34" fill="url(#lampBody)"/>
      <ellipse cx="856" cy="80" rx="24" ry="31" fill="url(#lampBody)"/>
      <ellipse cx="1094" cy="122" rx="26" ry="33" fill="url(#lampBody)"/>
