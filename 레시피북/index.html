/** 0.5 → "1/2", 1.5 → "1과 1/2" 처럼 사람이 읽기 쉬운 분수로 */
function formatAmount(n) {
  if (n === null || n === undefined) return null;
  const whole = Math.floor(n + 0.001);
  const frac = n - whole;
  let fracStr = '';
  if (Math.abs(frac - 0.5) < 0.01) fracStr = '1/2';
  else if (Math.abs(frac - 0.25) < 0.01) fracStr = '1/4';
  else if (Math.abs(frac - 0.75) < 0.01) fracStr = '3/4';
  else if (frac > 0.01) return String(Math.round(n * 10) / 10);

  if (whole === 0) return fracStr || '0';
  if (!fracStr) return String(whole);
  return whole + '과 ' + fracStr;
}

/** 초 → "03:20" */
function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/** 타이머가 끝났을 때 짧은 알림음 (별도 라이브러리 없이 브라우저 기본 기능) */
function playChime() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    [880, 1174].forEach(function (freq, i) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + i * 0.28;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
      osc.start(start);
      osc.stop(start + 0.55);
    });
  } catch (e) {
    /* 소리를 못 내는 환경이면 조용히 넘어간다 */
  }
}

function Timer({ step, stepIndex, onFinish }) {
  const [remaining, setRemaining] = useState(step.seconds);
  const [running, setRunning] = useState(false);
  const onFinishRef = useRef(onFinish);
  onFinishRef.current = onFinish;

  // 단계가 바뀌면 타이머를 새로 맞춘다
  useEffect(function () {
    setRemaining(step.seconds);
    setRunning(false);
  }, [stepIndex, step.seconds]);

  // 1초마다 감소
  useEffect(function () {
    if (!running) return undefined;
    const id = setInterval(function () {
      setRemaining(function (prev) {
        if (prev <= 1) {
          setRunning(false);
          playChime();
          onFinishRef.current();
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return function () { clearInterval(id); };
  }, [running]);

  const progress = ((step.seconds - remaining) / step.seconds) * 100;
  const finished = remaining === 0;

  return (
    <Card className="p-6 no-print">
      <p className="text-center text-base text-stone-500">
        {stepIndex + 1}단계 · {step.title}
      </p>

      <p
        className={`tabular mt-2 text-center text-6xl sm:text-7xl font-black ${
          finished ? 'text-emerald-600' : running ? 'text-rose-600' : 'text-stone-800'
        }`}
        aria-live="polite"
      >
        {formatClock(remaining)}
      </p>

      <div className="mt-4 h-3 w-full overflow-hidden rounded-full bg-stone-200">
        <div
          className={`h-full rounded-full transition-all duration-500 ${finished ? 'bg-emerald-500' : 'bg-rose-500'}`}
          style={{ width: progress + '%' }}
        />
      </div>

      {finished && (
        <p className="mt-4 rounded-xl bg-emerald-50 px-4 py-3 text-center text-lg font-bold text-emerald-800">
          ⏰ 이 단계 끝! 다음 단계로 넘어가세요.
        </p>
      )}

      <div className="mt-6 flex flex-wrap justify-center gap-3">
        <Button
          size="lg"
          variant={running ? 'secondary' : 'primary'}
          onClick={function () { setRunning(function (r) { return !r; }); }}
          disabled={finished}
          className={running ? '' : 'ring-pulse'}
        >
          {running ? '⏸ 잠깐 멈춤' : '▶ 시작'}
        </Button>
        <Button
          size="lg"
          variant="ghost"
          onClick={function () {
            setRunning(false);
            setRemaining(step.seconds);
          }}
        >
          ↺ 처음으로
        </Button>
      </div>
    </Card>
  );
}

function StepsSection() {
  const [activeIndex, setActiveIndex] = useState(0);
  const [doneIndexes, setDoneIndexes] = useState([]);

          {STEPS.map(function (step, i) {
            return (
              <StepCard
                key={step.title}
                step={step}
                index={i}
                isActive={i === activeIndex}
                isDone={doneIndexes.indexOf(i) >= 0}
                onSelect={function () { setActiveIndex(i); }}
              />
            );
          })}
        </div>

        <div className="lg:sticky lg:top-6 lg:self-start">
          <Timer step={STEPS[activeIndex]} stepIndex={activeIndex} onFinish={handleFinish} />

          <div className="mt-4 flex gap-3 no-print">
            <Button
              variant="secondary"
              className="flex-1"
              onClick={function () { setActiveIndex(function (i) { return Math.max(0, i - 1); }); }}
              disabled={activeIndex === 0}
            >
              ← 이전
            </Button>
            <Button
              variant="secondary"
              className="flex-1"
              onClick={function () { setActiveIndex(function (i) { return Math.min(STEPS.length - 1, i + 1); }); }}
              disabled={activeIndex === STEPS.length - 1}
            >
              다음 →
            </Button>
          </div>

          {allDone && (
            <p className="mt-4 rounded-xl bg-rose-50 px-4 py-4 text-center text-lg font-bold text-rose-800 no-print">
              🎉 완성! 맛있게 드세요.
            </p>
          )}
        </div>
      </div>
    </section>
  );
}


// ========================================
// 📄 Section: 요령
// ========================================

function TipsSection() {
  return (
    <section className="mx-auto max-w-5xl px-5 py-10" aria-labelledby="tips-heading">
      <div id="tips-heading">
        <SectionTitle emoji="✨" title="요령" hint="해보고 알게 된 것들" />
      </div>

      <ul className="grid gap-3 sm:grid-cols-2">
        {TIPS.map(function (tip, i) {
          return (
            <li key={i}>
              <Card className={`h-full p-5 text-lg leading-relaxed ${tip.star ? 'border-amber-300 bg-amber-50' : ''}`}>
                <span className="mr-2" aria-hidden="true">{tip.star ? '⭐' : '·'}</span>
                <Rich text={tip.text} />
              </Card>
            </li>
          );
        })}
      </ul>
    </section>
  );
}


// ========================================
// 📄 Section: 완성 사진
// ========================================

function PhotoSection() {
  return (
    <section className="mx-auto max-w-5xl px-5 py-10">
      <SectionTitle emoji="📸" title="완성 모습" />
      <Card className="overflow-hidden">
        <img
          src={RECIPE.photo}
          alt="달걀 반숙을 올린 김치참치 덮밥 완성 사진"
          className="h-72 w-full object-cover sm:h-96"
        />
      </Card>
    </section>
  );
}


// ========================================
// 🚀 App
// ========================================

function App() {
  return (
    <div className="min-h-screen">
      <Header />

      <main>
        <IngredientsSection />
        <StepsSection />
        <TipsSection />
        <PhotoSection />

        <div className="mx-auto max-w-5xl px-5 pb-4 text-center no-print">
          <Button variant="secondary" size="lg" onClick={function () { window.print(); }}>
            🖨 이 레시피 인쇄하기
          </Button>
        </div>
      </main>

      <Footer />
    </div>
  );
}


// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
